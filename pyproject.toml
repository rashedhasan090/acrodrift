[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acrodrift"
version = "0.1.0"
description = "Catch acronym drift in LaTeX papers and Markdown docs: undefined, out-of-order, misspelled, conflicting, and scope-leaked acronyms."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Md Rashedul Hasan" }]
requires-python = ">=3.8"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Text Processing :: Markup :: LaTeX"]

[project.scripts]
acrodrift = "acrodrift.cli:main"

[tool.setuptools]
packages = ["acrodrift"]
